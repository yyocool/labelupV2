# LabelUp development host — PHP 8.1. HTTP kept for existing OAuth callbacks.

server {
    listen 80;
    server_name labelupdev.gagamkorea.kr;
    root /home/labelupdev/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 32m;

    access_log /home/wwwlogs/labelupdev.access.log;
    error_log /home/wwwlogs/labelupdev.error.log;

    location ^~ /.well-known/ {
        allow all;
        default_type text/plain;
    }

    location /editor/ {
        try_files $uri $uri/ /editor/index.html;
        types {
            application/wasm wasm;
            application/octet-stream dll;
            application/octet-stream dat;
            application/javascript js;
            text/css css;
            text/html html;
            application/json json;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            font/woff woff;
            font/woff2 woff2;
        }
        default_type application/octet-stream;
    }

    location ~* ^/editor/_framework/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        access_log off;
        types {
            application/wasm wasm;
            application/octet-stream dll;
            application/octet-stream dat;
            application/javascript js;
            application/json json;
        }
        default_type application/octet-stream;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.(css|js|png|jpg|jpeg|gif|webp|svg|woff2?|wasm|dll|dat)$ {
        expires 7d;
        access_log off;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_ADMIN_VALUE "open_basedir=/home/labelupdev/:/tmp/:/proc/";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name labelupdev.gagamkorea.kr;
    root /home/labelupdev/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 32m;

    ssl_certificate /usr/local/nginx/conf/ssl/labelupdev.gagamkorea.kr/fullchain.cer;
    ssl_certificate_key /usr/local/nginx/conf/ssl/labelupdev.gagamkorea.kr/labelupdev.gagamkorea.kr.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "TLS13-AES-256-GCM-SHA384:TLS13-CHACHA20-POLY1305-SHA256:TLS13-AES-128-GCM-SHA256:EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:RSA+AES128:RSA+AES256:!MD5";
    ssl_session_cache builtin:1000 shared:SSL:10m;
    ssl_dhparam /usr/local/nginx/conf/ssl/dhparam.pem;

    access_log /home/wwwlogs/labelupdev.access.log;
    error_log /home/wwwlogs/labelupdev.error.log;

    location /editor/ {
        try_files $uri $uri/ /editor/index.html;
        types {
            application/wasm wasm;
            application/octet-stream dll;
            application/octet-stream dat;
            application/javascript js;
            text/css css;
            text/html html;
            application/json json;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            font/woff woff;
            font/woff2 woff2;
        }
        default_type application/octet-stream;
    }

    location ~* ^/editor/_framework/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        access_log off;
        types {
            application/wasm wasm;
            application/octet-stream dll;
            application/octet-stream dat;
            application/javascript js;
            application/json json;
        }
        default_type application/octet-stream;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.(css|js|png|jpg|jpeg|gif|webp|svg|woff2?|wasm|dll|dat)$ {
        expires 7d;
        access_log off;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param PHP_ADMIN_VALUE "open_basedir=/home/labelupdev/:/tmp/:/proc/";
    }
}
