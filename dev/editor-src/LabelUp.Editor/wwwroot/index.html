<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#7B2840" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta http-equiv="Permissions-Policy" content="local-fonts=*" />

  <base href="/editor/" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preload" href="fonts/Pretendard-Regular.otf" as="font" type="font/otf" crossorigin />
  <link rel="preload" href="fonts/Pretendard-Bold.otf" as="font" type="font/otf" crossorigin />
  <link rel="stylesheet" href="css/app.css?v=20260908g" />
  <link rel="stylesheet" href="css/editor.css?v=20261006svg" />
  <link rel="stylesheet" href="css/tutorial.css?v=20261001tut" />
</head>
<body>
  <div id="app"></div>

  <div id="editor-boot" class="boot" aria-busy="true">
    <div class="boot__labi" aria-hidden="true">
      <svg class="boot__ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="boot__ring-track" cx="50" cy="50" r="46" pathLength="100" />
        <circle class="boot__ring-fill" cx="50" cy="50" r="46" pathLength="100" />
      </svg>
      <img class="boot__labi-img" src="img/labi-wink.png?v=20260913k" alt="" width="128" height="128" />
      <span class="boot__labi-shadow"></span>
    </div>
    <div class="boot__pct loading-progress-text"></div>
    <p class="boot__ai">with AI - 라벨업</p>
  </div>

  <div id="blazor-error-ui">
    편집기를 불러오지 못했습니다.
    <a href="" class="reload">다시 시도</a>
    <a class="dismiss">닫기</a>
  </div>
  <script src="js/editor.js?v=20261006svg"></script>
  <script src="js/panel-dock.js?v=20260908g"></script>
  <script src="js/tutorial.js?v=20261001tut2"></script>
  <script src="/js/home-ai-chat.js?v=20261006mode"></script>
  <script src="/js/daum-address.js?v=20260906c"></script>
  <script src="/js/address-book.js?v=20260913a"></script>
  <script src="/js/toss-pay.js?v=20261001a"></script>
  <!--
    아래 ?v= 자리 글자는 퍼블리시할 때 scripts/publish_editor.py 가 blazor.boot.json
    해시로 바꿔 준다. _framework 의 LabelUp.Editor.wasm·dotnet.native.wasm·blazor.boot.json
    은 파일 이름이 고정이라 이 토큰이 유일한 캐시 무효화 수단이다. 토큰이 빌드마다 바뀌지
    않으면 브라우저가 낡은 네이티브 wasm 과 새 어셈블리를 섞어 쓰다가 네이티브 호출을 찾지
    못해 통째로 죽는다. loadBootResource 가 주소를 돌려주면 Blazor 는 integrity 검사를
    건너뛰므로 섞여도 걸러 주지 못한다. 그래서 토큰이 내용에 따라 바뀌는 것이 더욱 중요하다.
  -->
  <script src="_framework/blazor.webassembly.js?v=BOOTSTAMP" autostart="false"></script>
  <script>
    Blazor.start({
      loadBootResource: function (type, name, defaultUri) {
        return defaultUri + (defaultUri.indexOf('?') >= 0 ? '&' : '?') + 'v=BOOTSTAMP';
      }
    });
  </script>
</body>
</html>
