<body class="editor-body">

  </div>

    편집기를 불러오지 못했습니다.

  <!--
    위쪽 css/·js/·img/ 의 ?v= 값과 아래 ?v= 자리 글자는 모두 퍼블리시할 때
    scripts/publish_editor.py 가 내용 해시로 바꿔 준다. 손으로 고치지 않아도 된다.
    (/js/ 로 시작하는 사이트 뿌리 파일만 예외로 손으로 적는다.)

    아래 것은 blazor.boot.json 해시를 쓴다. _framework 의 LabelUp.Editor.wasm·
    dotnet.native.wasm·blazor.boot.json 은 파일 이름이 고정이라 이 토큰이 유일한 캐시
    무효화 수단이다. 토큰이 빌드마다 바뀌지 않으면 브라우저가 낡은 네이티브 wasm 과 새
    어셈블리를 섞어 쓰다가 네이티브 호출을 찾지 못해 통째로 죽는다. loadBootResource 가
    주소를 돌려주면 Blazor 는 integrity 검사를 건너뛰므로 섞여도 걸러 주지 못한다.
    그래서 토큰이 내용에 따라 바뀌는 것이 더욱 중요하다.
  -->
  <script src="_framework/blazor.webassembly.js?v=BOOTSTAMP" autostart="false"></script>
  <script>
    (function () {
      var token = 'BOOTSTAMP';
      var hidden = false;
      function hideBoot() {
        if (hidden) return;
        hidden = true;
        if (window.labelUpEditor && window.labelUpEditor.hideBoot) {
          window.labelUpEditor.hideBoot();
          return;
        }
        var el = document.getElementById('editor-boot');
        if (!el) return;
        el.classList.add('is-done');
        el.setAttribute('hidden', '');
        el.style.setProperty('display', 'none', 'important');
      }
      function withStamp(uri) {
        return uri + (uri.indexOf('?') >= 0 ? '&' : '?') + 'v=' + token;
      }
      function resourceUrl(name, defaultUri) {
        if (/icudt\.(dat|bin)$/i.test(name) || /icudt\.(dat|bin)/i.test(defaultUri)) {
          return 'icu.php?v=' + token;
        }
        return withStamp(defaultUri);
      }
      var lastText = '';
      var lastChange = Date.now();
      var seenPct = false;
      var stallTimer = setInterval(function () {
        var el = document.querySelector('.loading-progress-text');
        var cssPct = getComputedStyle(document.documentElement).getPropertyValue('--blazor-load-percentage-text') || '';
        var now = String(el ? el.textContent || '' : '').trim() || String(cssPct).replace(/"/g, '').trim();
        var m = now.match(/(\d+)\s*%/);
        var pct = m ? parseInt(m[1], 10) : -1;
        if (now !== lastText) {
          lastText = now;
          lastChange = Date.now();
          if (pct >= 0) seenPct = true;
        }
        if (seenPct && Date.now() - lastChange >= 2500 && pct >= 85) {
          hideBoot();
          clearInterval(stallTimer);
        }
      }, 400);
      setTimeout(function () {
        hideBoot();
        clearInterval(stallTimer);
      }, 6000);
      try {
        Blazor.start({
          loadBootResource: function (type, name, defaultUri) {
            var url = resourceUrl(name, defaultUri);
            if (type === 'dotnetjs') return url;
            return fetch(url, { cache: 'no-cache' }).then(function (res) {
              if (res.ok) return res;
              if (/icudt/i.test(String(name) + String(defaultUri))) {
                return fetch('_framework/icudt.bin?v=' + token, { cache: 'reload' });
              }
              return res;
            });
          }
        }).then(hideBoot).catch(hideBoot);
      } catch (e) {
        hideBoot();
      }
    })();
  </script>
</body>
</html>
