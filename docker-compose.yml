services:
  app:
    build: .
    container_name: labelup-app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    environment:
      LABELUP_ENV: docker
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-labelup}
      DB_USERNAME: ${DB_USERNAME:-labelup}
      DB_PASSWORD: ${DB_PASSWORD:-labelup}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: labelup-db
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-labelup}
      MYSQL_USER: ${DB_USERNAME:-labelup}
      MYSQL_PASSWORD: ${DB_PASSWORD:-labelup}
    volumes:
      - labelup_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  labelup_mysql_data:
